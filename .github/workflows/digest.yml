name: daily-digest

on:
  schedule:
    # 22:00 UTC == 06:00 Asia/Shanghai
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider (deepseek | fake)"
        type: choice
        options: [deepseek, fake]
        default: deepseek

# Pages deployment needs these; the eval commit-back needs contents: write.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Tests run before any network call: if the pipeline is broken, fail the
      # job here rather than publishing a broken page.
      - name: Test
        run: pytest -q

      # The SQLite file is the only state that has to survive between runs:
      # feed ETags, ingested articles, and "already featured" history.
      - name: Restore digest database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: digest-db-${{ github.run_id }}
          restore-keys: |
            digest-db-

      - name: Build digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          TZ: Asia/Shanghai
        run: python -m ai_digest run

      - name: Save digest database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: digest-db-${{ github.run_id }}

      # Freeze today's candidate pool, write Chinese gists, and publish the
      # labelling page with the site. Then commit the case so the labels that
      # come back tomorrow have something to attach to.
      - name: Freeze eval case
        env:
          TZ: Asia/Shanghai
        run: python -m ai_digest eval snapshot

      - name: Annotate eval case
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          TZ: Asia/Shanghai
        run: |
          case_file="eval/cases/$(date +%F).json"
          if [ -f "$case_file" ]; then
            python -m ai_digest eval annotate "$case_file" || echo "::warning::annotate failed; the page will show a warning banner"
          fi

      - name: Render labelling pages
        run: |
          shopt -s nullglob
          for case_file in eval/cases/*.json; do
            case "$case_file" in *.zh.json) continue;; esac
            python -m ai_digest eval label "$case_file" --no-open --out public/eval
          done

      - name: Commit eval case
        continue-on-error: true
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/cases
          if git diff --cached --quiet; then
            echo "no new case to commit"
            exit 0
          fi
          git commit -m "chore(eval): freeze case $(date +%F)"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

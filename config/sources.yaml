# Feeds polled by every run. `weight` biases which source represents a cluster
# when the same story appears in several places (>1.0 = more authoritative).
# Adding a feed should be a config change, never a code change.
#
# `enabled: false` marks feeds that were tried and failed from a mainland
# network. Keeping them in the file with a reason beats deleting them and
# rediscovering the same failure next month.
sources:
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    weight: 1.3
    tags: [research]

  - name: OpenAI
    url: https://openai.com/news/rss.xml
    weight: 1.3
    tags: [industry]

